name: Build de app móvil (Android/iOS)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm install
      - name: Compilar el frontend
        run: npm run build
      - name: Agregar proyecto Android (lo regenera de cero cada vez)
        run: npx cap add android
      - name: Sincronizar el build con el proyecto nativo
        run: npx cap sync android
      - name: Compilar APK de depuración
        run: cd android && ./gradlew assembleDebug
      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 🍎 Sin firma de Apple (necesita un Apple Developer Program propio, no algo que este
  # workflow pueda tener) esto NO produce un .ipa instalable en un dispositivo real ni
  # publicable — solo confirma que el proyecto iOS compila. Cargar la firma real es tarea
  # del dueño de la app, ver el README.
  ios-verificacion:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Compilar el frontend
        run: npm run build
      - name: Agregar proyecto iOS (lo regenera de cero cada vez)
        run: npx cap add ios
      - name: Sincronizar el build con el proyecto nativo
        run: npx cap sync ios
      - name: Instalar Pods (solo si el proyecto usa CocoaPods)
        run: cd ios/App && if [ -f Podfile ]; then pod install; else echo 'Swift Package Manager, no hace falta pod install'; fi
      - name: Compilar para simulador, sin firma (solo verifica que compila)
        run: cd ios/App && if [ -f Podfile ]; then DESTINO='-workspace App.xcworkspace'; else DESTINO='-project App.xcodeproj'; fi && xcodebuild $DESTINO -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
